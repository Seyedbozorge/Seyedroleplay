name: Build SRP Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with System Gradle
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        
        PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        
        cd "$PROJECT_DIR"
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SeyedRoleplay-Launcher-Debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
