name: Build SRP Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK with Gradle
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "پروژه در این پوشه پیدا شد: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # معرفی مسیر Android SDK به پروژه برای جلوگیری از خطای بیلد
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        sudo apt-get update && sudo apt-get install -y gradle
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SeyedRoleplay-Launcher-Debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
