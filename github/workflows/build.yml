name: Build SRP Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Wrapper and Build APK
      run: |
        # پیدا کردن هوشمند پوشه پروژه
        PROJECT_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" -maxdepth 3 -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "پروژه در این پوشه پیدا شد: $PROJECT_DIR"
        
        # رفتن به داخل پوشه پروژه و انجام تمام کارها در همانجا
        cd "$PROJECT_DIR"

        # نصب گریدل روی سرور
        sudo apt-get update && sudo apt-get install -y gradle

        # ساخت فایل gradlew اگر وجود نداشته باشد
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

        # دادن دسترسی اجرا و بیلد نهایی در همان پوشه
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SeyedRoleplay-Launcher-Debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
