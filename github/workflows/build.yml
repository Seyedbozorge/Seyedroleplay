name: Build SRP Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Wrapper and Build APK
      run: |
        # پیدا کردن پوشه اصلی پروژه
        PROJECT_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" -maxdepth 3 -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "پروژه در این پوشه پیدا شد: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # نصب گریدل روی سرور گیت‌هاب
        sudo apt-get update && sudo apt-get install -y gradle

        # ساخت فایل gradlew در صورت عدم وجود
        if [ ! -f "gradlew" ]; then
          gradle wrapper || true
        fi

        # ایجاد اسکریپت جایگزین برای اطمینان از عدم وقوع خطا
        if [ ! -f "gradlew" ]; then
          echo '#!/usr/bin/env bash' > gradlew
          echo 'exec gradle "$@"' >> gradlew
        fi

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SeyedRoleplay-Launcher-Debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
