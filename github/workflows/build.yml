name: Build SRP Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare and Build APK
      run: |
        # پیدا کردن پوشه اصلی پروژه
        TARGET_DIR="."
        if [ -d "SeyedRoleplayLauncher" ]; then
          TARGET_DIR="SeyedRoleplayLauncher"
        fi
        cd "$TARGET_DIR"

        # نصب ابزار گریدل در سرور گیت‌هاب
        sudo apt-get update && sudo apt-get install -y gradle || true

        # اگر فایل gradlew وجود نداشت، به صورت خودکار ایجاد می‌شود
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.5 || true
        fi
        
        if [ ! -f "gradlew" ]; then
          echo '#!/usr/bin/env sh' > gradlew
          echo 'gradle "$@"' >> gradlew
        fi

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SeyedRoleplay-Launcher-Debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
