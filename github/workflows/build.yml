name: Build SRP Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find Project and Build APK
      run: |
        # پیدا کردن خودکار پوشه اصلی پروژه که فایل‌های اندروید در آن قرار دارند
        PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -exec dirname {} \;)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "پروژه در این پوشه پیدا شد: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # نصب گریدل و ساخت خودکار فایل‌های مدیریت بیلد (gradlew) در صورت عدم وجود
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SeyedRoleplay-Launcher-Debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
