    - name: Generate Wrapper and Build APK
      run: |
        PROJECT_DIR=$(find . -maxdepth 3 \( -name settings.gradle -o -name build.gradle \) -exec dirname {} \; | head -n 1)
        [ -z "$PROJECT_DIR" ] && PROJECT_DIR="."
        echo "Project dir: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug
        else
          sudo apt-get update && sudo apt-get install -y gradle
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug
          else
            echo "No gradlew and could not install gradle; aborting."
            exit 1
          fi
        fi
